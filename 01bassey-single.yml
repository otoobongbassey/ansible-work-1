---
- name: Update all servers
  hosts: group1
  become: yes
  tasks:
    - name: Update package repositories (Debian/Ubuntu)
      apt:
        update_cache: yes
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: Update package repositories (RedHat/Amazon Linux)
      yum:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"
